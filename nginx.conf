server {
  listen 80;

  # Compression. Without this every asset shipped raw: the entry bundle alone
  # was 324 KB on the wire instead of ~98 KB, and the locale files 237 KB
  # instead of ~59 KB. gzip_vary is required because the edge nginx caches
  # these responses with proxy_cache and must key on Accept-Encoding.
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    font/woff2;

  root /usr/share/nginx/html;
  index index.html;

  # Vite writes content-hashed filenames here, so the contents of any given
  # URL can never change. Cache them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Not content-hashed, but cache-busted by the ?v= build stamp that
  # src/lib/i18n appends.
  location /locales/ {
    expires 1y;
    add_header Cache-Control "public";
    try_files $uri =404;
  }

  # The SPA shell names every hashed asset, so it must never be cached —
  # a stale index.html points at assets from the previous deploy.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location / {
    try_files $uri /index.html;
  }
}
