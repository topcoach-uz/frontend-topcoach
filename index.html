<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="canonical" href="https://topcoachuni.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Top Coach - Empowering Your Journey to Success</title>

    <!-- Non-blocking Google Fonts: preconnect opens the TLS handshake early,
         then we load the stylesheet with a swap-on-load trick so CSS parsing
         isn't blocked waiting on the font request. display=swap means text
         paints in fallback fonts instantly, then swaps in Inter/Montserrat. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap"
      />
    </noscript>
    

    <!-- Open Graph Metadata for Telegram -->
    <meta
      property="og:title"
      content="Top Coach - Empowering Your Journey to Success"
    />
    <meta
      property="og:description"
      content="Join Top Coach for personalized coaching programs and events designed to help you achieve your goals."
    />
    <meta property="og:image" content="/img/og-image.png" />
    <meta property="og:url" content="https://www.topcoachuni.com" />
    <meta property="og:type" content="website" />
    
    
    <!-- Google Analytics 4 -->
    <!-- Will be initialized in main.tsx using VITE_GA4_MEASUREMENT_ID -->
    
    <!-- Microsoft Clarity Analytics -->
    <script type="text/javascript">
        (function(c,l,a,r,i,t,y){
            c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
            t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
            y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
        })(window, document, "clarity", "script", "t3bba2oqeo");
    </script>
  </head>
  <body>
    <!-- Static splash: shows from the very first paint until React mounts
         into #root (then :empty stops matching and it disappears — no JS).
         Same maroon dot language as the app's loaders, and the 0.4s fade-in
         delay means fast loads never see it at all. -->
    <style>
      #root:empty::before {
        content: '';
        position: fixed;
        inset: 0;
        background: #ffffff;
      }
      #root:empty::after {
        content: '';
        position: fixed;
        top: 50%;
        left: 50%;
        width: 12px;
        height: 12px;
        margin: -6px 0 0 -6px;
        border-radius: 50%;
        color: #7b1f2f;
        box-shadow: -20px 0 0, 20px 0 0, 0 -20px 0, 0 20px 0;
        opacity: 0;
        animation: splash-in 0.3s ease 0.4s forwards, splash-spin 1.1s linear 0.4s infinite;
      }
      @keyframes splash-in {
        to { opacity: 0.85; }
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
