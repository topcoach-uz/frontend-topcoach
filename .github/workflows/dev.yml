name: Dev preview

# Static preview deployments to the DEV server.
#
#   push to `dev`   → https://dev.topcoachuni.com
#   any PR          → https://<branch-slug>.dev.topcoachuni.com  (comment on PR)
#   PR closed       → preview folder removed
#
# Builds are plain Vite bundles rsync'd to /srv/previews/frontend/<slug>/ on
# the dev server; caddy there serves them and proxies /api to the shared dev
# backend. Required secrets: DEV_SSH_PRIVATE_KEY, DEV_SSH_USER, DEV_SERVER_IP.

on:
  workflow_dispatch:
    inputs:
      my_programs_mode:
        type: choice
        required: false
        options: [inspect, deploy]
      workspace_mode:
        type: choice
        required: false
        options: [inspect, deploy]
      course_schedule_mode:
        type: choice
        required: false
        options: [inspect, deploy]
      schedule_filter_mode:
        type: choice
        required: false
        options: [inspect, deploy]
      shared_applications_mode:
        type: choice
        required: false
        options: [inspect, deploy]
  push:
    branches:
      - dev
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: dev-preview-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  slug:
    runs-on: ubuntu-latest
    outputs:
      slug: ${{ steps.slug.outputs.slug }}
      url: ${{ steps.slug.outputs.url }}
    steps:
      - name: Compute branch slug
        id: slug
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            SLUG=dev
          else
            SLUG=$(echo "${{ github.head_ref }}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+|-+$//g' | cut -c1-40)
          fi
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          if [ "$SLUG" = "dev" ]; then
            echo "url=https://dev.topcoachuni.com" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://$SLUG.dev.topcoachuni.com" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: slug
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[preserve-dev-runtime]')) || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test imported listening adapter
        run: |
          node --test src/pages/student-hub/ielts-prep/listening-library.test.js
          yarn esbuild src/pages/student-hub/ielts-prep/ImportedListening.test.jsx --bundle --platform=node --format=cjs --outfile=/tmp/ielts-listening-renderer.test.cjs
          node --test /tmp/ielts-listening-renderer.test.cjs

      - name: Check Full Support payment states
        run: node .github/scripts/test-full-support-gate.cjs

      - name: Build
        env:
          # Same-origin API: caddy on the dev server proxies /api → dev backend
          VITE_API_HOST: ''
          VITE_ADMIN_PANEL_URL: https://admin.dev.topcoachuni.com/panel
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn build

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Upload to dev server
        run: |
          DEST=${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SERVER_IP }}
          SLUG=${{ needs.slug.outputs.slug }}
          ssh -o StrictHostKeyChecking=no $DEST "mkdir -p /srv/previews/frontend/$SLUG"
          rsync -az --delete -e "ssh -o StrictHostKeyChecking=no" dist/ $DEST:/srv/previews/frontend/$SLUG/

      - name: Record preview URL
        run: echo "Preview deployed to ${{ needs.slug.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        continue-on-error: true
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🚀 Preview deployed: ${{ needs.slug.outputs.url }}

            (talks to the shared dev API at dev.topcoachuni.com; updates on every push)

  cleanup:
    needs: slug
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}

      - name: Remove preview folder
        run: |
          SLUG=${{ needs.slug.outputs.slug }}
          if [ -z "$SLUG" ] || [ "$SLUG" = "dev" ]; then exit 0; fi
          ssh -o StrictHostKeyChecking=no ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SERVER_IP }} "rm -rf /srv/previews/frontend/$SLUG"

      - name: Comment cleanup on PR
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview
          message: |
            🧹 Preview environment removed.

  promote-full-support:
    if: (github.event_name == 'workflow_dispatch' && !inputs.workspace_mode && !inputs.shared_applications_mode && !inputs.schedule_filter_mode && !inputs.course_schedule_mode && !inputs.my_programs_mode) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[preserve-dev-runtime]') && !contains(github.event.head_commit.message, '[workspace-promotion]') && !contains(github.event.head_commit.message, '[learning-access-fix]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      - name: Promote Full Support UI while preserving current dev features
        env:
          DEST: ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SERVER_IP }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${DEST#*@}" >> ~/.ssh/known_hosts
          scp .github/scripts/promote-full-support-dev.py "$DEST:/tmp/"
          ssh "$DEST" 'python3 /tmp/promote-full-support-dev.py inspect'
          scp "$DEST:/tmp/full-support-ui-snapshot.json" full-support-ui-snapshot.json
          npm install --prefix /tmp/fs-ui-compiler --no-audit --no-fund typescript@5.7.3 esbuild@0.25.5
          NODE_PATH=/tmp/fs-ui-compiler/node_modules node .github/scripts/compile-full-support-dev.cjs
          scp full-support-ui-bundle.json "$DEST:/tmp/"
          ssh "$DEST" 'python3 /tmp/promote-full-support-dev.py deploy' | tee full-support-ui-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-support-ui-promotion
          path: full-support-ui-result.json

  workspaces:
    if: github.event_name == 'workflow_dispatch' && inputs.workspace_mode && !inputs.shared_applications_mode && !inputs.schedule_filter_mode && !inputs.course_schedule_mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      - name: Snapshot or promote main dev workspaces
        env:
          DEST: ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SERVER_IP }}
          MODE: ${{ inputs.workspace_mode }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${DEST#*@}" >> ~/.ssh/known_hosts
          scp .github/scripts/promote-workspaces-dev.py "$DEST:/tmp/"
          if [ "$MODE" = inspect ]; then
            ssh "$DEST" 'python3 /tmp/promote-workspaces-dev.py inspect'
            scp "$DEST:/tmp/workspace-ui-snapshot.json" workspace-ui-snapshot.json
          else
            scp "$DEST:/tmp/workspace-ui-snapshot.json" workspace-ui-snapshot.json
            yarn install --frozen-lockfile
            node .github/scripts/compile-workspaces-dev.cjs
            scp workspace-ui-bundle.json "$DEST:/tmp/"
            ssh "$DEST" 'python3 /tmp/promote-workspaces-dev.py deploy' | tee workspace-ui-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-ui-${{ inputs.workspace_mode }}
          path: |
            workspace-ui-snapshot.json
            workspace-ui-result.json

  shared-applications:
    if: github.event_name == 'workflow_dispatch' && inputs.shared_applications_mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      - name: Inspect or promote shared application screens
        env:
          DEST: ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SERVER_IP }}
          MODE: ${{ inputs.shared_applications_mode }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${DEST#*@}" >> ~/.ssh/known_hosts
          scp .github/scripts/promote-shared-applications-dev.py "$DEST:/tmp/"
          ssh "$DEST" 'python3 /tmp/promote-shared-applications-dev.py inspect'
          scp "$DEST:/tmp/shared-applications-ui-snapshot.json" shared-applications-ui-snapshot.json
          if [ "$MODE" = deploy ]; then
            yarn install --frozen-lockfile
            node .github/scripts/compile-shared-applications-dev.cjs
            scp shared-applications-ui-bundle.json "$DEST:/tmp/"
            ssh "$DEST" 'python3 /tmp/promote-shared-applications-dev.py deploy' | tee shared-applications-ui-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-applications-ui-${{ inputs.shared_applications_mode }}
          path: |
            shared-applications-ui-snapshot.json
            shared-applications-ui-result.json

  schedule-filter:
    if: github.event_name == 'workflow_dispatch' && inputs.schedule_filter_mode && github.ref_name == 'feat/mentor-schedule-filter-20261031'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      - name: Inspect or publish mentor schedule filter
        env:
          DEST: ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SERVER_IP }}
          MODE: ${{ inputs.schedule_filter_mode }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${DEST#*@}" >> ~/.ssh/known_hosts
          scp .github/scripts/promote-schedule-filter-dev.py "$DEST:/tmp/"
          ssh "$DEST" 'python3 /tmp/promote-schedule-filter-dev.py inspect'
          scp "$DEST:/tmp/schedule-filter-ui-snapshot.json" schedule-filter-ui-snapshot.json
          if [ "$MODE" = deploy ]; then
            npm install --prefix /tmp/schedule-filter-compiler --no-audit --no-fund typescript@5.7.3 sass@1.83.4
            NODE_PATH=/tmp/schedule-filter-compiler/node_modules node .github/scripts/compile-schedule-filter-dev.cjs
            scp schedule-filter-ui-bundle.json "$DEST:/tmp/"
            ssh "$DEST" 'python3 /tmp/promote-schedule-filter-dev.py deploy' | tee schedule-filter-ui-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-filter-${{ inputs.schedule_filter_mode }}
          path: |
            schedule-filter-ui-snapshot.json
            schedule-filter-ui-result.json

  course-schedule:
    if: github.event_name == 'workflow_dispatch' && inputs.course_schedule_mode && github.ref_name == 'feat/mentor-unified-course-schedule-20261031'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      - name: Inspect or publish mentor schedule filter
        env:
          DEST: ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SERVER_IP }}
          MODE: ${{ inputs.course_schedule_mode }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${DEST#*@}" >> ~/.ssh/known_hosts
          scp .github/scripts/promote-course-schedule-dev.py "$DEST:/tmp/"
          ssh "$DEST" 'python3 /tmp/promote-course-schedule-dev.py inspect'
          scp "$DEST:/tmp/course-schedule-ui-snapshot.json" course-schedule-ui-snapshot.json
          if [ "$MODE" = deploy ]; then
            yarn install --frozen-lockfile
            node .github/scripts/compile-course-schedule-dev.cjs
            scp course-schedule-ui-bundle.json "$DEST:/tmp/"
            ssh "$DEST" 'python3 /tmp/promote-course-schedule-dev.py deploy' | tee course-schedule-ui-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: course-schedule-${{ inputs.course_schedule_mode }}
          path: |
            course-schedule-ui-snapshot.json
            course-schedule-ui-result.json

  my-programs:
    if: github.event_name == 'workflow_dispatch' && inputs.my_programs_mode && github.ref_name == 'feat/my-programs-dev-20261031'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      - name: Inspect or publish My Programs
        env:
          DEST: ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SERVER_IP }}
          MODE: ${{ inputs.my_programs_mode }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${DEST#*@}" >> ~/.ssh/known_hosts
          scp .github/scripts/promote-my-programs-dev.py "$DEST:/tmp/"
          ssh "$DEST" 'python3 /tmp/promote-my-programs-dev.py inspect'
          scp "$DEST:/tmp/my-programs-ui-snapshot.json" my-programs-ui-snapshot.json
          if [ "$MODE" = deploy ]; then
            yarn install --frozen-lockfile
            node .github/scripts/compile-my-programs-dev.cjs
            scp my-programs-ui-bundle.json "$DEST:/tmp/"
            ssh "$DEST" 'python3 /tmp/promote-my-programs-dev.py deploy' | tee my-programs-ui-result.json
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: my-programs-ui-${{ inputs.my_programs_mode }}
          path: |
            my-programs-ui-snapshot.json
            my-programs-ui-result.json
