<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TopCoach · Motif QA</title><style>body{margin:0;background:#fcfaf6;color:#25221e;font-family:Arial,sans-serif}header{padding:22px 32px;background:#641c2b;color:#fff}main{max-width:1100px;padding:30px;margin:auto}h1{font-size:26px}h2{margin-top:32px}p{color:#736c61;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:#f3ece3;border:1px solid #e5dbcd;border-radius:14px;padding:20px;color:#7b1f2f}.card svg{width:100%;height:130px}.card strong{display:block;font-size:14px;margin-top:12px}.card small{display:block;color:#736c61;margin-top:8px;font-size:11px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}main{padding:16px}.card{padding:12px}}</style></head><body><header>TOPCOACH / VISUAL QA</header><main><h1>Subjects with their own visual identity</h1><p>Decorative motifs only—not a saved or generated student report.</p><div id="subjects"></div><h2>Dates stay intact. Activities choose the illustration.</h2><div id="phases"></div></main><script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import MajorIllustration from '/src/pages/student-hub/major-match-v2/components/MajorIllustration.tsx';
import JourneyStageIllustration from '/src/pages/student-hub/major-match-v2/components/JourneyStageIllustration.tsx';
import {journeyStage} from '/src/pages/student-hub/major-match-v2/journeyStage.ts';
const h=React.createElement;
const names=['Biomedical Sciences','Medical Laboratory Science','Health Sciences','Neuroscience','Law','Architecture','Psychology','Environmental Science','Engineering','Mathematics','Music','Education'];
createRoot(document.querySelector('#subjects')).render(h('div',{className:'grid'},names.map(name=>h('div',{className:'card',key:name},h(MajorIllustration,{name}),h('strong',null,name)))));
const phases=[['Grade 10–11',['Maintain GPA','Develop research','Prepare for competitions']],['Summer Grade 11',['Build university list','Draft statements']],['Grade 12 (Fall)',['Submit applications','Review documents']],['Spring 2027',['Review offers','Finalize enrollment and visas']]];
createRoot(document.querySelector('#phases')).render(h('div',{className:'grid'},phases.map(([when,actions])=>{const stage=journeyStage(when,actions);return h('div',{className:'card',key:when},h(JourneyStageIllustration,{kind:stage.kind}),h('strong',null,when),h('small',null,stage.kind));})));
</script></body></html>
